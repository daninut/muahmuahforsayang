<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>36,000 Muah Muahhs</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #4a4a4a;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            color: #d81b60;
            margin-bottom: 5px;
            font-size: 2.5rem;
        }
        p.subtitle {
            font-size: 1.1rem;
            color: #880e4f;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            max-width: 800px;
            width: 100%;
            padding: 20px;
            max-height: 60vh;
            overflow-y: auto;
            word-break: break-all;
            line-height: 1.8;
            font-size: 1rem;
            color: #555;
            border: 2px solid #ff4081;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
            color: #666;
        }
        button {
            background-color: #e91e63;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(233, 30, 99, 0.3);
            transition: background 0.2s, transform 0.1s;
            margin-top: 15px;
        }
        button:hover {
            background-color: #c2185b;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <header>
        <h1>💋 36,000 Muah Muahhs 💋</h1>
        <p class="subtitle">An endless stream of affection!</p>
    </header>

    <div class="container" id="contentBox">
    </div>

    <button onclick="copyText()">Copy All to Clipboard</button>

    <div class="footer">
        <p>Made with ❤️ and endless kisses.</p>
    </div>

    <script>
        const phrase = "muah muahh ";
        const totalCount = 36000;

        for (let i = 0; i < totalCount; i++) {
            fullText += phrase;
        }

        document.getElementById("contentBox").innerText = fullText;

        function copyText() {
            navigator.clipboard.writeText(fullText).then(() => {
                alert("All 36,000 muah muahhs copied to your clipboard!");
            }).catch(err => {

            });
        }

</body>
</html>
