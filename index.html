<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>muah muah for sayangg</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #4a4a4a;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            color: #d81b60;
            margin-bottom: 5px;
            font-size: 2.5rem;
        }
        p.subtitle {
            font-size: 1.1rem;
            color: #880e4f;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            max-width: 800px;
            width: 100%;
            padding: 20px;
            max-height: 70vh;
            overflow-y: auto;
            word-break: break-all;
            line-height: 1.8;
            font-size: 1rem;
            color: #555;
            border: 2px solid #ff4081;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <h1>36 Thousands muah muah demi boleh manja manjaa</h1>
        <p class="subtitle">Scroll down!</p>
    </header>

    <div class="container" id="contentBox">
    </div>

    <div class="footer">
        <p>Semua ni demi boleh manja2 balik dengan sayangg, hehehe ❤</p>
    </div>

    <script>
        const phrase = "muah muahh ";
        const totalCount = 36000;
        
        let fullText = "";
        for (let i = 0; i < totalCount; i++) {
            fullText += phrase;
        }

        document.getElementById("contentBox").innerText = fullText;
    </script>

</body>
</html>
